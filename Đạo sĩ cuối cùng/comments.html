<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 Quản lý bình luận — Đạo Sĩ Cuối Cùng</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: "Segoe UI", "Times New Roman", sans-serif;
    background: #0a0a0f;
    color: #e8e8e8;
    min-height: 100vh;
}

/* ============ LOGIN GATE ============ */
#loginGate {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center, rgba(255,215,0,0.1), rgba(0,0,0,0.95) 60%),
        #0a0a0f;
    z-index: 9999;
    padding: 20px;
}
#loginGate.hidden { display: none; }
.login-card {
    background: linear-gradient(160deg, #1a1c2a 0%, #0d0f1a 100%);
    border: 2px solid rgba(255,215,0,.55);
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.9), 0 0 40px rgba(255,215,0,.2);
}
.login-card h1 {
    color: gold;
    font-size: 24px;
    margin: 0 0 8px;
    text-shadow: 0 0 15px gold;
    letter-spacing: 2px;
}
.login-card p.sub {
    color: #888;
    font-size: 14px;
    margin: 0 0 28px;
}
.login-card input {
    width: 100%;
    padding: 14px 18px;
    margin-bottom: 14px;
    background: rgba(0,0,0,.6);
    border: 2px solid rgba(255,215,0,.3);
    border-radius: 12px;
    color: white;
    font-size: 16px;
    outline: none;
    transition: .25s;
}
.login-card input:focus {
    border-color: gold;
    box-shadow: 0 0 18px rgba(255,215,0,.4);
}
.login-card button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ffe600, #ffae00);
    color: #161000;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .25s;
    margin-top: 6px;
}
.login-card button:hover {
    background: linear-gradient(135deg, #fff7b0, #ffc400);
    box-shadow: 0 0 25px gold;
    transform: scale(1.02);
}
.login-card button:disabled { opacity: .6; cursor: wait; }
.login-msg {
    min-height: 22px;
    font-size: 14px;
    margin-top: 12px;
    color: #ff7777;
}
.back-link {
    display: inline-block;
    margin-top: 18px;
    color: #888;
    text-decoration: none;
    font-size: 14px;
    transition: .25s;
}
.back-link:hover { color: gold; }

/* ============ ADMIN PANEL ============ */
#adminPanel { display: none; }
#adminPanel.active { display: block; }

.admin-header {
    background: linear-gradient(135deg, #1a1c2a 0%, #0d0f1a 100%);
    border-bottom: 2px solid rgba(255,215,0,.4);
    padding: 18px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 15px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 5px 30px rgba(0,0,0,.6);
}
.admin-header h1 {
    margin: 0;
    color: gold;
    font-size: 22px;
    text-shadow: 0 0 12px gold;
    display: flex;
    align-items: center;
    gap: 12px;
}
.admin-user {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: #ccc;
}
.admin-user img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid gold;
    object-fit: cover;
}
.admin-logout {
    padding: 8px 18px;
    border: 2px solid #ff4444;
    border-radius: 20px;
    background: rgba(255,0,0,.1);
    color: #ff7777;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: .25s;
}
.admin-logout:hover { background: red; color: white; }

/* ============ TABS ============ */
.admin-tabs {
    display: flex;
    gap: 8px;
    padding: 20px 25px 0;
    flex-wrap: wrap;
    max-width: 1400px;
    margin: 0 auto;
}
.admin-tab {
    padding: 10px 22px;
    border: 2px solid rgba(255,215,0,.35);
    border-radius: 30px;
    background: rgba(0,0,0,.5);
    color: gold;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .25s;
    display: flex;
    align-items: center;
    gap: 8px;
}
.admin-tab:hover { background: rgba(255,215,0,.12); }
.admin-tab.active {
    background: linear-gradient(135deg, #ffe600, #ffae00);
    color: #161000;
    border-color: #ffc400;
    box-shadow: 0 0 20px rgba(255,215,0,.5);
}
.admin-tab .badge {
    background: rgba(255,0,0,.7);
    color: white;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    margin-left: 4px;
}

/* ============ CONTENT ============ */
.admin-content {
    max-width: 1400px;
    margin: 0 auto;
    padding: 25px;
}
.tab-pane { display: none; }
.tab-pane.active { display: block; animation: fadeIn .3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ============ STATS GRID ============ */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-bottom: 25px;
}
.stat-card {
    background: linear-gradient(160deg, #1a1c2a, #0d0f1a);
    border: 2px solid rgba(255,215,0,.35);
    border-radius: 16px;
    padding: 22px;
    transition: .3s;
    position: relative;
    overflow: hidden;
}
.stat-card:hover {
    transform: translateY(-4px);
    border-color: gold;
    box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 30px rgba(255,215,0,.3);
}
.stat-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, gold, transparent);
}
.stat-card .stat-icon {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    background: rgba(255,215,0,.12);
    display: flex;
    align-items: center;
    justify-content: center;
    color: gold;
    font-size: 22px;
    margin-bottom: 14px;
}
.stat-card .stat-value {
    font-size: 38px;
    font-weight: bold;
    color: gold;
    line-height: 1;
    text-shadow: 0 0 15px rgba(255,215,0,.5);
}
.stat-card .stat-label {
    font-size: 14px;
    color: #999;
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* ============ TOOLBAR ============ */
.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
}
.toolbar input,
.toolbar select {
    padding: 11px 16px;
    background: rgba(0,0,0,.6);
    border: 2px solid rgba(255,215,0,.3);
    border-radius: 30px;
    color: white;
    font-size: 14px;
    outline: none;
    transition: .25s;
    font-family: inherit;
}
.toolbar input { flex: 1; min-width: 200px; }
.toolbar select { min-width: 180px; }
.toolbar input:focus,
.toolbar select:focus { border-color: gold; box-shadow: 0 0 15px rgba(255,215,0,.35); }
.toolbar .refresh-btn {
    padding: 11px 20px;
    border: 2px solid gold;
    border-radius: 30px;
    background: transparent;
    color: gold;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .25s;
    display: flex;
    align-items: center;
    gap: 8px;
}
.toolbar .refresh-btn:hover { background: gold; color: black; }

/* ============ TABLE ============ */
.data-table {
    width: 100%;
    background: #10121c;
    border: 2px solid rgba(255,215,0,.25);
    border-radius: 16px;
    overflow: hidden;
    border-collapse: collapse;
}
.data-table thead {
    background: linear-gradient(135deg, #1a1c2a, #0d0f1a);
}
.data-table th {
    text-align: left;
    padding: 14px 18px;
    color: gold;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 2px solid rgba(255,215,0,.3);
    font-weight: 600;
}
.data-table td {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,215,0,.08);
    font-size: 14px;
    vertical-align: middle;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover { background: rgba(255,215,0,.04); }

.data-table img.avatar-sm {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,215,0,.4);
}

.comment-content {
    max-width: 500px;
    line-height: 1.5;
    word-wrap: break-word;
    color: #d8d8d8;
}
.comment-video {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(255,215,0,.1);
    color: gold;
    font-size: 12px;
    margin-top: 5px;
    border: 1px solid rgba(255,215,0,.25);
}
.comment-time { color: #888; font-size: 13px; white-space: nowrap; }

.btn-sm {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1.5px solid;
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.btn-danger {
    border-color: #ff4444;
    color: #ff7777;
}
.btn-danger:hover { background: #ff4444; color: white; }
.btn-primary {
    border-color: gold;
    color: gold;
}
.btn-primary:hover { background: gold; color: black; }

/* ============ EMPTY STATE ============ */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #666;
}
.empty-state i {
    font-size: 60px;
    color: rgba(255,215,0,.2);
    margin-bottom: 20px;
}
.empty-state h3 {
    color: #888;
    font-size: 20px;
    margin: 0 0 8px;
}
.empty-state p { font-size: 14px; margin: 0; }

/* ============ LOADING ============ */
.loading-row {
    text-align: center;
    padding: 40px;
    color: gold;
    font-size: 16px;
}
.loading-row i { animation: spin 1s linear infinite; margin-right: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ TOAST ============ */
#adminToast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: #161822;
    color: white;
    padding: 14px 26px;
    border-radius: 12px;
    border: 2px solid gold;
    box-shadow: 0 0 30px rgba(255,215,0,.5);
    font-size: 15px;
    font-weight: 600;
    z-index: 999999;
    transition: all .4s ease;
    opacity: 0;
    max-width: 90%;
    text-align: center;
}
#adminToast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
#adminToast.success { border-color: #4ade80; box-shadow: 0 0 30px rgba(74,222,128,.4); }
#adminToast.error { border-color: #ff2a5f; box-shadow: 0 0 30px rgba(255,42,95,.4); }

@media (max-width: 700px) {
    .admin-header { padding: 12px 15px; }
    .admin-header h1 { font-size: 17px; }
    .admin-content { padding: 15px; }
    .admin-tabs { padding: 15px 15px 0; }
    .admin-tab { padding: 8px 14px; font-size: 13px; }
    .data-table { font-size: 13px; }
    .data-table th, .data-table td { padding: 10px 12px; }
    .comment-content { max-width: 200px; font-size: 13px; }
    .stat-card { padding: 18px; }
    .stat-card .stat-value { font-size: 30px; }
}
</style>
</head>
<body>

<!-- ============ LOGIN GATE ============ -->
<div id="loginGate">
    <div class="login-card">
        <h1>💬 QUẢN LÝ BÌNH LUẬN</h1>
        <p class="sub">Đăng nhập bằng tài khoản admin</p>
        <input type="text" id="adminUsername" placeholder="Tên tài khoản" autocomplete="off">
        <input type="password" id="adminPassword" placeholder="Mật khẩu" autocomplete="current-password">
        <button id="adminLoginBtn" onclick="adminLogin()">
            <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
        </button>
        <div class="login-msg" id="loginMsg"></div>
        <a href="index.html" class="back-link">← Về trang chủ</a>
    </div>
</div>

<!-- ============ ADMIN PANEL ============ -->
<div id="adminPanel">
    <header class="admin-header">
        <h1><i class="fa-solid fa-comments"></i> Quản Lý Bình Luận</h1>
        <div class="admin-user">
            <span id="adminName">—</span>
            <img id="adminAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="">
            <button class="admin-logout" onclick="adminLogout()">
                <i class="fa-solid fa-power-off"></i> Đăng xuất
            </button>
        </div>
    </header>

    <div class="admin-tabs">
        <button class="admin-tab active" data-tab="stats">
            <i class="fa-solid fa-chart-line"></i> Thống kê
        </button>
        <button class="admin-tab" data-tab="comments">
            <i class="fa-solid fa-comments"></i> Bình luận
            <span class="badge" id="commentsBadge">0</span>
        </button>
        <button class="admin-tab" data-tab="users">
            <i class="fa-solid fa-users"></i> Người dùng
            <span class="badge" id="usersBadge">0</span>
        </button>
        <button class="admin-tab" data-tab="likes">
            <i class="fa-solid fa-heart"></i> Lượt thích
        </button>
    </div>

    <div class="admin-content">

        <!-- ===== TAB: STATS ===== -->
        <div class="tab-pane active" id="pane-stats">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                    <div class="stat-value" id="statUsers">—</div>
                    <div class="stat-label">Người dùng</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-comments"></i></div>
                    <div class="stat-value" id="statComments">—</div>
                    <div class="stat-label">Bình luận</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-heart"></i></div>
                    <div class="stat-value" id="statLikes">—</div>
                    <div class="stat-label">Lượt thích</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-bell"></i></div>
                    <div class="stat-value" id="statSubscribers">—</div>
                    <div class="stat-label">Đăng ký kênh</div>
                </div>
            </div>

            <div class="stat-card" style="max-width: 100%;">
                <div class="stat-label" style="margin-bottom: 15px;">📊 Top 5 video nhiều bình luận nhất</div>
                <div id="topVideos"><div class="loading-row"><i class="fa-solid fa-spinner"></i> Đang tải...</div></div>
            </div>
        </div>

        <!-- ===== TAB: COMMENTS ===== -->
        <div class="tab-pane" id="pane-comments">
            <div class="toolbar">
                <input type="text" id="searchComment" placeholder="🔍 Tìm nội dung bình luận...">
                <input type="text" id="filterVideo" placeholder="🎬 Lọc theo video_id...">
                <button class="refresh-btn" onclick="loadComments()">
                    <i class="fa-solid fa-rotate-right"></i> Làm mới
                </button>
                <button class="refresh-btn" onclick="deleteAllComments()" style="border-color:#ff4444;color:#ff7777;">
                    <i class="fa-solid fa-trash"></i> Xóa tất cả
                </button>
            </div>
            <div id="commentsTableWrap">
                <div class="loading-row"><i class="fa-solid fa-spinner"></i> Đang tải...</div>
            </div>
        </div>

        <!-- ===== TAB: USERS ===== -->
        <div class="tab-pane" id="pane-users">
            <div class="toolbar">
                <input type="text" id="searchUser" placeholder="🔍 Tìm tên người dùng...">
                <button class="refresh-btn" onclick="loadUsers()">
                    <i class="fa-solid fa-rotate-right"></i> Làm mới
                </button>
            </div>
            <div id="usersTableWrap">
                <div class="loading-row"><i class="fa-solid fa-spinner"></i> Đang tải...</div>
            </div>
        </div>

        <!-- ===== TAB: LIKES ===== -->
        <div class="tab-pane" id="pane-likes">
            <div class="toolbar">
                <input type="text" id="searchLikeVideo" placeholder="🎬 Lọc theo video_id...">
                <button class="refresh-btn" onclick="loadLikes()">
                    <i class="fa-solid fa-rotate-right"></i> Làm mới
                </button>
            </div>
            <div id="likesTableWrap">
                <div class="loading-row"><i class="fa-solid fa-spinner"></i> Đang tải...</div>
            </div>
        </div>

    </div>
</div>

<div id="adminToast"></div>

<!-- ============ SUPABASE ============ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================
   ADMIN PANEL — kết nối Supabase
   ===================================================== */
const SUPABASE_URL      = 'https://ouwnbwazwgklzyrqsiod.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91d25id2F6d2drbHp5cnFzaW9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTMwNjQsImV4cCI6MjEwNjAyOTA2NH0.Fv6zcMVORdPtD9QlvMZJ0PWqlyshHUViatix-wNzsPs';
const SYNTH_DOMAIN      = '@daosicuoicung.app';
const DEFAULT_AVATAR    = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentProfile = null;
let isAdmin = false;

/* =====================================================
   TOAST
   ===================================================== */
function toast(msg, type = 'info') {
    const t = document.getElementById('adminToast');
    t.textContent = msg;
    t.className = 'show ' + type;
    clearTimeout(t._t);
    t._t = setTimeout(() => { t.className = ''; }, 3000);
}

/* =====================================================
   LOGIN
   ===================================================== */
function cleanUsername(raw) {
    return String(raw || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/gi, 'd').toLowerCase()
        .replace(/[^a-z0-9_]/g, '');
}

async function adminLogin() {
    const username = cleanUsername(document.getElementById('adminUsername').value);
    const password = document.getElementById('adminPassword').value;
    const msgEl = document.getElementById('loginMsg');
    const btn = document.getElementById('adminLoginBtn');

    if (!username || !password) {
        msgEl.textContent = '⚠️ Nhập đầy đủ tên và mật khẩu!';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang kiểm tra...';
    msgEl.textContent = '';

    try {
        const email = username + SYNTH_DOMAIN;
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;

        currentUser = data.user;

        const { data: prof } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
        currentProfile = prof;

        const { data: adminRow, error: adminErr } = await sb.from('admins')
            .select('user_id').eq('user_id', currentUser.id).maybeSingle();

        if (adminErr || !adminRow) {
            await sb.auth.signOut();
            msgEl.textContent = '🚫 Tài khoản này không có quyền admin!';
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập';
            return;
        }

        isAdmin = true;
        msgEl.textContent = '';

        document.getElementById('loginGate').classList.add('hidden');
        document.getElementById('adminPanel').classList.add('active');
        document.getElementById('adminName').textContent = currentProfile?.username || username;
        document.getElementById('adminAvatar').src = currentProfile?.avatar_url || DEFAULT_AVATAR;

        loadStats();
        loadComments();
        loadUsers();
        loadLikes();

        toast('✅ Chào mừng admin!', 'success');

    } catch (err) {
        console.error('[login]', err);
        const m = (err.message || '').toLowerCase();
        if (m.includes('invalid')) msgEl.textContent = '❌ Sai tên hoặc mật khẩu!';
        else msgEl.textContent = '❌ ' + (err.message || 'Lỗi đăng nhập!');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập';
    }
}

async function adminLogout() {
    if (!confirm('Đăng xuất khỏi Admin Panel?')) return;
    await sb.auth.signOut();
    location.reload();
}

document.getElementById('adminPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') adminLogin();
});
document.getElementById('adminUsername').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('adminPassword').focus();
});

/* =====================================================
   TABS
   ===================================================== */
document.querySelectorAll('.admin-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('pane-' + tab.dataset.tab).classList.add('active');
    });
});

/* =====================================================
   STATS
   ===================================================== */
async function loadStats() {
    try {
        const [users, comments, likes, subs] = await Promise.all([
            sb.from('profiles').select('*', { count: 'exact', head: true }),
            sb.from('comments').select('*', { count: 'exact', head: true }),
            sb.from('likes').select('*', { count: 'exact', head: true }),
            sb.from('site_subscribers').select('*', { count: 'exact', head: true })
        ]);

        document.getElementById('statUsers').textContent = users.count || 0;
        document.getElementById('statComments').textContent = comments.count || 0;
        document.getElementById('statLikes').textContent = likes.count || 0;
        document.getElementById('statSubscribers').textContent = subs.count || 0;

        document.getElementById('commentsBadge').textContent = comments.count || 0;
        document.getElementById('usersBadge').textContent = users.count || 0;

        const { data: allComments } = await sb.from('comments').select('video_id, video_title');
        if (allComments && allComments.length) {
            const counts = {};
            allComments.forEach(c => {
                const key = c.video_id;
                if (!counts[key]) counts[key] = { count: 0, title: c.video_title || c.video_id };
                counts[key].count++;
            });
            const sorted = Object.values(counts).sort((a, b) => b.count - a.count).slice(0, 5);
            const wrap = document.getElementById('topVideos');
            if (sorted.length === 0) {
                wrap.innerHTML = '<p style="color:#666;">Chưa có dữ liệu.</p>';
            } else {
                wrap.innerHTML = sorted.map((v, i) => `
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,215,0,.1);">
                        <div style="display:flex;align-items:center;gap:12px;">
                            <span style="width:28px;height:28px;border-radius:50%;background:rgba(255,215,0,.15);color:gold;display:flex;align-items:center;justify-content:center;font-weight:bold;">${i+1}</span>
                            <span style="color:#ddd;">${escapeHTML(v.title)}</span>
                        </div>
                        <span style="color:gold;font-weight:bold;">${v.count} 💬</span>
                    </div>
                `).join('');
            }
        }

    } catch (e) {
        console.error('[stats]', e);
        toast('Lỗi tải thống kê!', 'error');
    }
}

/* =====================================================
   COMMENTS
   ===================================================== */
let allComments = [];

async function loadComments() {
    const wrap = document.getElementById('commentsTableWrap');
    wrap.innerHTML = '<div class="loading-row"><i class="fa-solid fa-spinner"></i> Đang tải...</div>';

    try {
        const { data, error } = await sb.from('comments')
            .select('id, content, created_at, user_id, video_id, video_title, profiles(username, avatar_url)')
            .order('created_at', { ascending: false })
            .limit(500);

        if (error) throw error;
        allComments = data || [];
        renderComments();

    } catch (e) {
        console.error('[comments]', e);
        wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><h3>Lỗi tải bình luận</h3><p>Vui lòng chạy lại SQL trong Supabase</p></div>';
    }
}

function renderComments() {
    const search = document.getElementById('searchComment').value.toLowerCase().trim();
    const filterVid = document.getElementById('filterVideo').value.toLowerCase().trim();

    let filtered = allComments;
    if (search) filtered = filtered.filter(c => (c.content || '').toLowerCase().includes(search));
    if (filterVid) filtered = filtered.filter(c => (c.video_id || '').toLowerCase().includes(filterVid));

    document.getElementById('commentsBadge').textContent = filtered.length;

    const wrap = document.getElementById('commentsTableWrap');
    if (filtered.length === 0) {
        wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-comment-slash"></i><h3>Không có bình luận nào</h3><p>Bình luận sẽ xuất hiện ở đây khi có người dùng viết.</p></div>';
        return;
    }

    const rows = filtered.map(c => {
        const p = c.profiles || {};
        const time = new Date(c.created_at).toLocaleString('vi-VN');
        return `
            <tr data-id="${c.id}">
                <td><img class="avatar-sm" src="${escapeHTML(p.avatar_url || DEFAULT_AVATAR)}" onerror="this.src='${DEFAULT_AVATAR}'"></td>
                <td><b style="color:gold;">${escapeHTML(p.username || 'Ẩn danh')}</b></td>
                <td>
                    <div class="comment-content">${escapeHTML(c.content).replace(/\n/g, '<br>')}</div>
                    <div class="comment-video">🎬 ${escapeHTML(c.video_title || c.video_id)}</div>
                </td>
                <td class="comment-time">${time}</td>
                <td><button class="btn-sm btn-danger" onclick="deleteCommentRow(${c.id})"><i class="fa-solid fa-trash"></i> Xóa</button></td>
            </tr>`;
    }).join('');

    wrap.innerHTML = `<table class="data-table"><thead><tr>
        <th style="width:60px;">Avatar</th>
        <th style="width:150px;">Người dùng</th>
        <th>Nội dung bình luận</th>
        <th style="width:150px;">Thời gian</th>
        <th style="width:100px;">Hành động</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

document.getElementById('searchComment').addEventListener('input', renderComments);
document.getElementById('filterVideo').addEventListener('input', renderComments);

async function deleteCommentRow(id) {
    if (!confirm('Xóa bình luận này?')) return;
    try {
        const { error } = await sb.from('comments').delete().eq('id', id);
        if (error) throw error;
        allComments = allComments.filter(c => c.id !== id);
        renderComments();
        loadStats();
        toast('🗑 Đã xóa bình luận!', 'success');
    } catch (e) {
        console.error(e);
        toast('Không xóa được! Cần chạy SQL admin policy.', 'error');
    }
}

async function deleteAllComments() {
    if (!confirm('⚠️ XÓA TẤT CẢ bình luận? Hành động này không thể hoàn tác!')) return;
    if (!confirm('Chắc chắn chứ? Nhập OK để xóa toàn bộ.')) return;
    try {
        const { error } = await sb.from('comments').delete().neq('id', 0);
        if (error) throw error;
        allComments = [];
        renderComments();
        loadStats();
        toast('🗑 Đã xóa toàn bộ bình luận!', 'success');
    } catch (e) {
        console.error(e);
        toast('Không xóa được!', 'error');
    }
}

/* =====================================================
   USERS
   ===================================================== */
let allUsers = [];

async function loadUsers() {
    const wrap = document.getElementById('usersTableWrap');
    wrap.innerHTML = '<div class="loading-row"><i class="fa-solid fa-spinner"></i> Đang tải...</div>';

    try {
        const { data, error } = await sb.from('profiles')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(500);
        if (error) throw error;
        allUsers = data || [];

        const { data: allC } = await sb.from('comments').select('user_id');
        const { data: allL } = await sb.from('likes').select('user_id');
        const cCount = {}, lCount = {};
        (allC || []).forEach(c => { cCount[c.user_id] = (cCount[c.user_id] || 0) + 1; });
        (allL || []).forEach(l => { lCount[l.user_id] = (lCount[l.user_id] || 0) + 1; });

        allUsers.forEach(u => {
            u._commentCount = cCount[u.id] || 0;
            u._likeCount = lCount[u.id] || 0;
        });

        renderUsers();

    } catch (e) {
        console.error('[users]', e);
        wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><h3>Lỗi tải người dùng</h3></div>';
    }
}

function renderUsers() {
    const search = document.getElementById('searchUser').value.toLowerCase().trim();
    let filtered = allUsers;
    if (search) filtered = filtered.filter(u => (u.username || '').toLowerCase().includes(search));

    document.getElementById('usersBadge').textContent = filtered.length;

    const wrap = document.getElementById('usersTableWrap');
    if (filtered.length === 0) {
        wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-user-slash"></i><h3>Không có người dùng</h3></div>';
        return;
    }

    const rows = filtered.map(u => {
        const joinDate = u.created_at ? new Date(u.created_at).toLocaleDateString('vi-VN') : '—';
        return `
            <tr>
                <td><img class="avatar-sm" src="${escapeHTML(u.avatar_url || DEFAULT_AVATAR)}" onerror="this.src='${DEFAULT_AVATAR}'"></td>
                <td><b style="color:gold;">${escapeHTML(u.username || '—')}</b></td>
                <td><span style="color:#7ab0ff;">${u._commentCount}</span></td>
                <td><span style="color:#ff5c5c;">${u._likeCount}</span></td>
                <td class="comment-time">${joinDate}</td>
                <td><button class="btn-sm btn-danger" onclick="deleteUserData('${u.id}', '${escapeHTML(u.username || '')}')"><i class="fa-solid fa-broom"></i> Xóa data</button></td>
            </tr>`;
    }).join('');

    wrap.innerHTML = `<table class="data-table"><thead><tr>
        <th style="width:60px;">Avatar</th>
        <th>Username</th>
        <th style="width:100px;">💬 Comment</th>
        <th style="width:100px;">❤️ Like</th>
        <th style="width:140px;">Ngày tham gia</th>
        <th style="width:140px;">Hành động</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

document.getElementById('searchUser').addEventListener('input', renderUsers);

async function deleteUserData(userId, username) {
    if (!confirm(`Xóa toàn bộ comment + like của "${username}"?`)) return;
    try {
        await sb.from('comments').delete().eq('user_id', userId);
        await sb.from('likes').delete().eq('user_id', userId);
        await sb.from('site_subscribers').delete().eq('user_id', userId);
        toast(`🗑 Đã xóa data của ${username}!`, 'success');
        loadUsers();
        loadStats();
    } catch (e) {
        console.error(e);
        toast('Không xóa được!', 'error');
    }
}

/* =====================================================
   LIKES
   ===================================================== */
async function loadLikes() {
    const wrap = document.getElementById('likesTableWrap');
    wrap.innerHTML = '<div class="loading-row"><i class="fa-solid fa-spinner"></i> Đang tải...</div>';

    try {
        const { data, error } = await sb.from('likes')
            .select('id, video_id, created_at, user_id, profiles(username, avatar_url)')
            .order('created_at', { ascending: false })
            .limit(500);
        if (error) throw error;

        const filter = document.getElementById('searchLikeVideo').value.toLowerCase().trim();
        let filtered = data || [];
        if (filter) filtered = filtered.filter(l => (l.video_id || '').toLowerCase().includes(filter));

        if (filtered.length === 0) {
            wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-heart-crack"></i><h3>Không có lượt thích</h3></div>';
            return;
        }

        const rows = filtered.map(l => {
            const p = l.profiles || {};
            const time = new Date(l.created_at).toLocaleString('vi-VN');
            return `
                <tr>
                    <td><img class="avatar-sm" src="${escapeHTML(p.avatar_url || DEFAULT_AVATAR)}" onerror="this.src='${DEFAULT_AVATAR}'"></td>
                    <td><b style="color:gold;">${escapeHTML(p.username || '—')}</b></td>
                    <td><div class="comment-video">🎬 ${escapeHTML(l.video_id)}</div></td>
                    <td class="comment-time">${time}</td>
                </tr>`;
        }).join('');

        wrap.innerHTML = `<table class="data-table"><thead><tr>
            <th style="width:60px;">Avatar</th>
            <th style="width:180px;">Người dùng</th>
            <th>Video</th>
            <th style="width:150px;">Thời gian</th>
        </tr></thead><tbody>${rows}</tbody></table>`;

    } catch (e) {
        console.error('[likes]', e);
        wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><h3>Lỗi tải lượt thích</h3></div>';
    }
}

document.getElementById('searchLikeVideo').addEventListener('input', loadLikes);

/* =====================================================
   HELPERS
   ===================================================== */
function escapeHTML(s) {
    return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

/* =====================================================
   AUTO-LOGIN nếu session còn
   ===================================================== */
sb.auth.getSession().then(async ({ data }) => {
    if (data.session?.user) {
        const { data: adminRow } = await sb.from('admins')
            .select('user_id').eq('user_id', data.session.user.id).maybeSingle();
        if (adminRow) {
            currentUser = data.session.user;
            const { data: prof } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
            currentProfile = prof;
            isAdmin = true;

            document.getElementById('loginGate').classList.add('hidden');
            document.getElementById('adminPanel').classList.add('active');
            document.getElementById('adminName').textContent = currentProfile?.username || currentUser.email;
            document.getElementById('adminAvatar').src = currentProfile?.avatar_url || DEFAULT_AVATAR;

            loadStats();
            loadComments();
            loadUsers();
            loadLikes();
        }
    }
});

console.log('✅ comments.html loaded');
</script>
